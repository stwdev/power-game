name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: ./build.sh
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # Proves the Android app builds. It is signed with a throwaway key and
  # kept only as a workflow artifact; real releases use release.yml.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: ./build.sh
      - run: |
          go run ./cmd/genkey "$RUNNER_TEMP/key"
          android/build.sh 0.0.1 "$RUNNER_TEMP/key/signing-key.b64" "$RUNNER_TEMP/key/signing-cert.pem" power-game-test.apk
          rm -rf "$RUNNER_TEMP/key"
      - uses: actions/upload-artifact@v4
        with:
          name: power-game-test-apk
          path: power-game-test.apk
          retention-days: 7

  # Publishes the game to GitHub Pages (HTTPS) so it can be installed on
  # Android. Enable Pages with "GitHub Actions" as the source first.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
